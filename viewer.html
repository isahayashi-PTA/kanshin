---
layout: default
title: "デジタルブック版（テスト）"
---

<div class="viewer-outer-container" style="padding: 20px 10px; background-color: #f0f0f0; min-height: 80vh; display: flex; flex-direction: column; align-items: center;">
  
  <h2 style="margin-bottom: 10px; font-weight: bold; color: #333;">デジタルビューアー『諫親』</h2>
  <p style="color: #666; font-size: 0.85em; margin-bottom: 20px;">
    【操作方法】パソコン：端をドラッグ / スマホ：端をスワイプ
  </p>

  <div id="flipbook-wrapper" style="width: 100%; max-width: 1000px; display: flex; justify-content: center;">
    <div id="flipbook" dir="ltr">
      <div class="page" style="background-image:url('{{ site.baseurl }}/assets/images/kanshin4.png');"></div>
      
      <div class="page" style="background-image:url('{{ site.baseurl }}/assets/images/kanshin3.png');"></div>
      <div class="page" style="background-image:url('{{ site.baseurl }}/assets/images/kanshin2.png');"></div>
      
      <div class="page" style="background-image:url('{{ site.baseurl }}/assets/images/kanshin1.png');"></div>
      
      <div class="page" style="background: transparent !important; box-shadow: none !important;"></div>
    </div>
  </div>

  <div style="margin-top: 30px;">
     <button onclick="$('#flipbook').turn('previous')" style="padding: 10px 20px; cursor: pointer; background: #fff; border: 1px solid #ccc; border-radius: 5px;">◀ 次のページ</button>
     <button onclick="$('#flipbook').turn('next')" style="padding: 10px 20px; cursor: pointer; background: #fff; border: 1px solid #ccc; border-radius: 5px; margin-left: 10px;">前のページ ▶</button>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>

<style>
  #flipbook {
    width: 90vw;
    height: 63.6vw;
    max-width: 1000px;
    max-height: 707px;
  }

  #flipbook .page {
    width: 100%;
    height: 100%;
    background-color: white;
    background-size: 100% 100%;
    background-repeat: no-repeat;
    background-position: center;
    box-shadow: inset 0 0 50px rgba(0,0,0,0.1);
  }

  .turn-page {
    background-color: #ccc;
  }
</style>

<script>
  $(window).ready(function() {
    var flipbook = $('#flipbook');

    function updateSize() {
      var width = $('#flipbook-wrapper').width();
      if (width > 1000) width = 1000;
      var height = width / 1.414;
      flipbook.turn('size', width, height);
    }

    flipbook.turn({
      display: 'double',
      direction: 'ltr', // バグを防ぐため通常モードのまま中身を制御
      acceleration: true,
      gradients: true,
      elevation: 50
    });

    // 起動時に自動で最後のページ（実質の表紙）へジャンプさせてスタート！
    // これにより「左側に表紙がある状態」を作り出します
    flipbook.turn('page', 4);

    $(window).resize(function() {
      updateSize();
    });

    updateSize();
  });
</script>
