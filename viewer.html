---
layout: default
title: "デジタルブック版（テスト）"
---

<div class="viewer-outer-container" style="padding: 20px 10px; background-color: #f0f0f0; min-height: 80vh; display: flex; flex-direction: column; align-items: center;">
  
  <h2 style="margin-bottom: 10px; font-weight: bold; color: #333;">デジタルビューアー『諫親』</h2>
  <p style="color: #666; font-size: 0.85em; margin-bottom: 20px;">
    【操作方法】パソコン：端をドラッグ / スマホ：端をスワイプ
  </p>

  <div id="flipbook-wrapper" style="width: 100%; max-width: 1000px; display: flex; justify-content: center;">
    <div id="flipbook" dir="rtl">
      <div class="page" style="background-image:url('{{ site.baseurl }}/assets/images/kanshin1.png');"></div>
      <div class="page" style="background-image:url('{{ site.baseurl }}/assets/images/kanshin2.png');"></div>
      <div class="page" style="background-image:url('{{ site.baseurl }}/assets/images/kanshin3.png');"></div>
      <div class="page" style="background-image:url('{{ site.baseurl }}/assets/images/kanshin4.png');"></div>
    </div>
  </div>

  <div style="margin-top: 30px;">
     <button onclick="$('#flipbook').turn('next')" style="padding: 10px 20px; cursor: pointer; background: #fff; border: 1px solid #ccc; border-radius: 5px;">◀ 次のページ</button>
     <button onclick="$('#flipbook').turn('previous')" style="padding: 10px 20px; cursor: pointer; background: #fff; border: 1px solid #ccc; border-radius: 5px; margin-left: 10px;">前のページ ▶</button>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>

<style>
  /* A4の比率を保つためのスタイル設定 */
  #flipbook {
    width: 90vw;   /* 全体の幅 */
    height: 63.6vw; /* 見開き時の高さ (幅 ÷ 1.414) */
    max-width: 1000px;
    max-height: 707px; /* 1000px / 1.414 */
  }

  #flipbook .page {
    width: 100%;
    height: 100%;
    background-color: white;
    background-size: 100% 100%; /* 画像をページいっぱいに表示 */
    background-repeat: no-repeat;
    background-position: center;
    box-shadow: inset 0 0 50px rgba(0,0,0,0.1); /* 中央の薄い影（本らしさ） */
  }

  /* めくる際のエフェクト用 */
  .turn-page {
    background-color: #ccc;
  }
</style>

<script>
  $(window).ready(function() {
    var flipbook = $('#flipbook');

    // サイズの自動計算（A4比率を維持）
    function updateSize() {
      var width = $('#flipbook-wrapper').width();
      if (width > 1000) width = 1000;
      var height = width / 1.414; // A4見開きの比率
      
      flipbook.turn('size', width, height);
    }

    // 初期化
    flipbook.turn({
      display: 'double',    // 見開き表示
      direction: 'rtl',     // ★ここを右開き（Right to Left）に指定！
      acceleration: true,   // 加速
      gradients: true,      // 影のエフェクト
      elevation: 50,        // めくる高さ
      when: {
        turned: function(e, page) {
          // ページ移動時の処理
        }
      }
    });

    // 画面サイズ変更時にリサイズ
    $(window).resize(function() {
      updateSize();
    });

    updateSize();
  });
</script>
