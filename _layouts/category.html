---
layout: default
---

<div class="page-content">
  <div class="wrapper">

    <header class="category-header" style="text-align: center; margin-bottom: 40px; padding: 30px 0; border-bottom: 2px solid #e9ecef;">
      <h1 style="font-size: 2rem; color: #2c3e50; font-weight: 700; margin: 0;">
        {{ page.title }} 掲載トピック一覧
      </h1>
      <p style="color: #6c757d; margin-top: 10px; margin-bottom: 0;">
        読みたい記事（トピック）を選択してください。
      </p>
    </header>

    <div class="category-posts" style="max-width: 800px; margin: 0 auto;">
      
      {% for post in page.posts %}
        <article style="display: flex; gap: 20px; background: #fff; border: 1px solid #e9ecef; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); overflow: hidden;">
          
          {% if post.image %}
            <div style="flex: 0 0 120px; width: 120px; height: 120px;">
              <a href="{{ post.url | relative_url }}">
                <img src="{{ site.baseurl }}/{{ post.image }}" alt="{{ post.title }}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 4px;">
              </a>
            </div>
          {% endif %}

          <div style="flex: 1;">
            <h2 style="font-size: 1.25rem; margin-top: 0; margin-bottom: 10px;">
              <a href="{{ post.url | relative_url }}" style="color: #2c3e50; text-decoration: none; font-weight: 700;">
                {{ post.title }}
              </a>
            </h2>
            <p style="color: #6c757d; font-size: 0.9rem; line-height: 1.5; margin-bottom: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
              {{ post.description }}
            </p>
            <div style="margin-top: 10px; font-size: 0.85rem; color: #5a738e; font-weight: bold;">
              <a href="{{ post.url | relative_url }}" style="color: #5a738e; text-decoration: none;">
                記事を読む ➔
              </a>
            </div>
          </div>

        </article>
      {% endfor %}

    </div>

    <div style="text-align: center; margin-top: 40px;">
      <a href="{{ site.baseurl }}/" style="display: inline-block; background: #e9ecef; color: #495057; padding: 10px 20px; border-radius: 4px; text-decoration: none; font-size: 0.9rem; font-weight: bold;">
        ⬅ バックナンバー一覧へ戻る
      </a>
    </div>

  </div>
</div>
