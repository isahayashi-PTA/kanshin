lang: ja
title: "諌早市PTA連合会広報紙『諫親』"
description: "諌早市PTA連合会広報紙掲載サイトです。"
baseurl: "/kanshin"
url: "https://isahayashi-PTA.github.io"
favicon: images/favicon.png
google_analytics: G-1W1GCTG249

navigation:
  - text: Home
    url: /
  - text: デジタルブック「諫親」
    url: /viewer.html
  - text: About
    url: /about/
  - text: Style Guide
    url: /style-guide/
  - text: Tags
    url: /tags/
  - text: Download
    url: https://github.com/JustGoodThemes/Scriptor-Jekyll-Theme

# The shortname for your Disqus site to enable comments.
disqus: justgoodthemes

# Colors
accent_color: '#2d72d9'

# Site footer
footer:
  content: "&copy; Scriptor all rights reserved. Theme by [JustGoodThemes](https://www.justgoodthemes.com)."
  has_social: true

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-archives

# http://jekyllrb.com/docs/pagination/
paginate: 3
paginate_path: '/page:num/'

# Permalinks
permalink: /:title

# Conversion
markdown: kramdown

# Sass
sass:
  sass_dir: _sass
  style: compressed

jekyll-archives:
  enabled:
    - categories
  layout: 'category'
  permalink: '/category/:name/'
